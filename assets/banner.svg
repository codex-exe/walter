g><path class="ping" style="animation-delay:0.0s" d="M362,98 A22,22 0 0 1 362,142" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round"/><path class="ping" style="animation-delay:0.25s" d="M376,80 A40,40 0 0 1 376,160" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round"/><path class="ping" style="animation-delay:0.5s" d="M390,62 A58,58 0 0 1 390,178" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round"/><rect x="478" y="50" width="16" height="140" rx="4" fill="#22304d" stroke="#5b6b86" stroke-width="1.5"/><text x="436" y="212" font-size="12" fill="#5b6b86" text-anchor="middle" class="mono">&lt; 10 cm? back off</text></g>

</g>
<rect x=".5" y=".5" width="1199" height="319" rx="20" fill="none" stroke="#22304d"/>
</svg>
