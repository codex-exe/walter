<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Walter: A voice-controlled robot car that refuses to drive into walls.">
<title>Walter: A voice-controlled robot car that refuses to drive into walls.</title>
<defs>
<radialGradient id="glow" cx="82%" cy="18%" r="70%"><stop offset="0" stop-color="#fb7185" stop-opacity=".20"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>

</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}

.bar{transform-box:fill-box;transform-origin:center;animation:bar 1s ease-in-out infinite}
@keyframes bar{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.bt{animation:bt 1.2s linear infinite}
@keyframes bt{to{stroke-dashoffset:-24}}
.ping{animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{opacity:0}25%{opacity:1}70%,100%{opacity:0}}
.car{animation:car 3.2s ease-in-out infinite}
@keyframes car{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#card)">
<rect width="1200" height="320" fill="#0b1220"/>

<rect width="1200" height="320" fill="url(#glow)"/>

<text x="56" y="62" font-size="15" letter-spacing="2.5" fill="#fb7185" class="mono">ROBOTICS</text>
<text x="56" y="122" font-size="54" font-weight="800" fill="#e6edf3" letter-spacing="-1">Walter</text>
<text x="56" y="168" font-size="21" fill="#8b9bb4">A voice-controlled robot car that</text><text x="56" y="198" font-size="21" fill="#8b9bb4">refuses to drive into walls.</text>
<rect x="56" y="244" width="89" height="30" rx="15.0" fill="#fb7185" fill-opacity=".10" stroke="#fb7185" stroke-opacity=".45"/><text x="100.5" y="263.5" font-size="15" fill="#fb7185" text-anchor="middle" class="mono" textLength="63" lengthAdjust="spacingAndGlyphs">arduino</text><rect x="155" y="244" width="107" height="30" rx="15.0" fill="#fb7185" fill-opacity=".10" stroke="#fb7185" stroke-opacity=".45"/><text x="208.5" y="263.5" font-size="15" fill="#fb7185" text-anchor="middle" class="mono" textLength="81" lengthAdjust="spacingAndGlyphs">bluetooth</text><rect x="272" y="244" width="116" height="30" rx="15.0" fill="#fb7185" fill-opacity=".10" stroke="#fb7185" stroke-opacity=".45"/><text x="330.0" y="263.5" font-size="15" fill="#fb7185" text-anchor="middle" class="mono" textLength="90" lengthAdjust="spacingAndGlyphs">ultrasonic</text>
